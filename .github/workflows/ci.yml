name: ci-cd

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: secure
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: secure/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest
      # Cảnh báo thư viện có lỗ hổng đã biết; không chặn pipeline để buổi demo không bị đỏ ngoài ý muốn
      - run: pip install pip-audit && pip-audit -r requirements.txt
        continue-on-error: true

  secret-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Đảm bảo không commit file .env
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Phát hiện file .env đã bị commit. Hãy thu hồi các secret trong đó ngay!"
            exit 1
          fi

  build-and-push:
    # Chỉ chạy khi test và kiểm tra secret đều đạt, và chỉ trên nhánh main
    needs: [test, secret-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Tên image trên ghcr.io bắt buộc viết thường
      - name: Đặt tên image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/shop-api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Chỉ build bản "secure". Bản "vulnerable" không bao giờ được đẩy lên registry.
      - uses: docker/build-push-action@v6
        with:
          context: ./secure
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - name: Triển khai (minh họa)
        run: |
          echo "Bước triển khai thật: SSH vào server rồi chạy"
          echo "  docker compose pull && docker compose up -d"
          echo "Image vừa build: ${IMAGE}:${GITHUB_SHA}"
